<div class="split-screen">
  <!-- Left Side: Beautiful Image/Gradient -->
  <div class="left-pane">
    <div class="brand">
      <h1><i class="fa-solid fa-paw"></i> VetClinic</h1>
      <p>Next-Generation Veterinary Management</p>
    </div>
  </div>

  <!-- Right Side: Login Form -->
  <div class="right-pane">
    <div class="login-box">
      <h2>Welcome Back, Doctor</h2>
      <p class="subtitle">Please enter your credentials to access your dashboard.</p>
      
      <!-- If the python backend rejects us, show the error message -->
      <div *ngIf="errorMessage" class="error-box">
        <i class="fa-solid fa-triangle-exclamation"></i> {{ errorMessage }}
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" placeholder="dr.smith@clinic.com" (keyup.enter)="submitLogin()">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" placeholder="••••••••" (keyup.enter)="submitLogin()">
      </div>

      <button class="login-btn" (click)="submitLogin()" [disabled]="isLoading">
        {{ isLoading ? 'Authenticating...' : 'Log In' }}
      </button>
      
      <p class="help-text">Forgot your password? Please contact the IT administrator.</p>
    </div>
  </div>
</div>
