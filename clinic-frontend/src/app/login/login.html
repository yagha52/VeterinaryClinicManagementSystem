<div class="login-container">
  <h2>Veterinarian Login</h2>
  
  <!-- If the python backend rejects us, show the error message -->
  <div *ngIf="errorMessage" class="error-box">
    {{ errorMessage }}
  </div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" [(ngModel)]="email" placeholder="dr.smith@clinic.com">
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" [(ngModel)]="password" placeholder="••••••••">
  </div>

  <!-- When this button is clicked, trigger the submitLogin() function in your .ts file -->
  <button (click)="submitLogin()">Log In</button>
</div>
